name: .NET

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # reused by release.yml, so a release publishes exactly the package CI built and tested

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        # SDK 11 builds everything; the older runtimes are needed to run the tests on each of them.
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
          11.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Test (net8.0 library build, on .NET 8/9/10/11)
      run: dotnet test -c Release --no-build
    - name: Test (netstandard2.0 library build)
      run: dotnet test --project tests/MurmurHash.UnitTests -c Release -p:LibraryTargetFramework=netstandard2.0
    - name: Test (netstandard2.1 library build)
      run: dotnet test --project tests/MurmurHash.UnitTests -c Release -p:LibraryTargetFramework=netstandard2.1
    - name: NativeAOT smoke test (publish with no trim/AOT warnings, run reference vectors)
      run: |
        for tfm in net8.0 net10.0 net11.0; do
          dotnet publish tests/MurmurHash.AotTests -c Release -f $tfm -r linux-x64 -o aot/$tfm
          ./aot/$tfm/MurmurHash.AotTests
        done
    - name: Pack
      run: dotnet pack src/MurmurHash -c Release --no-build -o artifacts
    - uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: artifacts/*
